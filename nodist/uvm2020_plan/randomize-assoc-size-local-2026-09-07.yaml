implementation:
  - Treat associative .size() and .num() as existing key counts, including inline and scope randomization; only dynamic arrays and queues create solver size variables.
  - Preserve dependencies on random selectors and report unsupported selections before lowering can produce invalid expressions.
  - Refresh array bindings after callbacks and before solving, including inherited arrays, typedefs, replaced storage, and removed elements.
  - Avoid empty model-value queries and empty bit-selection expressions when registered arrays have no elements.
  - Resolve typedefs while constructing nested random array loops, avoiding references to deleted loop variables.
