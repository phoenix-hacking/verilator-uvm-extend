competitive_claims:
  - id: C0
    title: "Tracked competitive envelope"
    progress: 100
    bar: "[##########]"
    result: PASS
    acceptance: "PLAN.md, MATRIX.md, tracker.yaml, issue tree, and GitHub issues define the competitive support envelope."
  - id: C1
    title: "Usable UVM core"
    progress: 40
    bar: "[####------]"
    result: PASS
    acceptance: "UVM package/API tests plus scheduler, class, VIF, randomize, and coverage reduced tests pass or have documented limits."
    evidence:
      - "UVM 2020.3.1 no-DPI hello, DPI hello, and DPI HDL smoke capabilities pass under manual low-pressure commands."
      - "C1 class/factory-adjacent reduced shard passed across parameterized classes, inheritance, virtual dispatch, polymorphic copy, static functions, and dynamic casts."
      - "Minimal UVM 2020.3.1 no-DPI factory API test passed for object utils, type_id::create, type override, base-handle cast, and create_object_by_name."
      - "Minimal UVM 2020.3.1 no-DPI config DB/component-flow test passed for typed config object set/get into a child component during build/report."
      - "Minimal UVM 2020.3.1 no-DPI virtual interface config DB test passed for VIF set/get and live field read/write through the retrieved handle."
      - "Scheduler, clocking, randomize, coverage, resource precedence, TLM, and sequence API suites remain open, so C1 is not yet a usable-core claim."
  - id: C2
    title: "Protocol competitive"
    progress: 0
    bar: "[----------]"
    result: NOT_RUN
    acceptance: "APB and AXI-lite UVM environments pass with scoreboards, coverage, assertions, and RAL frontdoor."
  - id: C3
    title: "SoC competitive"
    progress: 0
    bar: "[----------]"
    result: NOT_RUN
    acceptance: "Synthetic SoC regression passes with multi-agent random traffic, reset/IRQ/DMA/RAL/DPI/coverage/performance."

advanced_parity_policy:
  statement: "Literal full IEEE 1800 parity is tracked, but it does not block the first competitive UVM support claim unless the target UVM/SoC workload depends on it."
