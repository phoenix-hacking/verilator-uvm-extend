    sha256: ec09225dee045a9f368cfe400faa5a2f891acb5d3ffdbff804985cfbb4453a3e
  patch_text: "diff --git a/src/base/uvm_resource_pool.svh b/src/base/uvm_resource_pool.svh\nindex ce21a14..8f1adfc\
    \ 100644\n--- a/src/base/uvm_resource_pool.svh\n+++ b/src/base/uvm_resource_pool.svh\n@@ -656,7 +656,7\
    \ @@ class uvm_resource_pool extends uvm_void;\n \n   // @uvm-ieee 1800.2-2020 auto C.2.4.4.3\n  \
    \ static function void sort_by_precedence(ref uvm_resource_types::rsrc_q_t q);\n-    uvm_resource_types::rsrc_sv_q_t\
    \ all[int];\n+    uvm_resource_types::rsrc_sv_q_t all[int unsigned];\n     uvm_resource_base r;\n\
    \     int unsigned prec;\n \n@@ -676,7 +676,7 @@ class uvm_resource_pool extends uvm_void;\n   //\
    \ Sorts a list of resources of resources in a standard SV\n   // queue instead of a uvm_queue.\n \
    \  static function void sort_by_precedence_q(ref uvm_resource_types::rsrc_sv_q_t q);\n-    uvm_resource_types::rsrc_sv_q_t\
    \ all[int];\n+    uvm_resource_types::rsrc_sv_q_t all[int unsigned];\n     uvm_resource_base r;\n\
    \     int unsigned prec;\n \n@@ -687,7 +687,7 @@ class uvm_resource_pool extends uvm_void;\n     end\n\
    \     q.delete();\n     foreach(all[iter]) begin\n-      q = {q, all[iter]};\n+      q = {all[iter],\
    \ q};\n     end\n   endfunction // sort_by_precedence_q    \n \n"
root_cause: The private resource queue sorter concatenates ascending precedence buckets, and both bucket
  maps use signed keys for an unsigned precedence value.
candidate_change:
- Use unsigned associative-array keys in both precedence sort implementations.
- Concatenate private sorter buckets in descending precedence order.
oracles:
  standard: IEEE 1800.2-2020
  clauses:
  - C.2.4.4.2
  - C.2.4.4.3
  - C.2.4.4.4
  - C.2.4.5.6
  highest_precedence: Select the highest unsigned value; on a tie, select the first resource in the supplied
    queue.
  direct_lookup: Require the declared highest matching resource, including changes across the sign bit
    and the unsigned maximum.
  public_sort: Require the highest unique precedence. Log both tie cases separately without claiming public-sort
    recency coverage.
  isolation: Exclude resources outside the scope and with a different type.
